<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Whole Thing | Wilba Rants</title>

  <link rel="icon" type="image/png" href="images/WR%20Favicon.png">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background: #111;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
    }

    .site-wrapper {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 40px 24px 60px;
    }


    /* =================================
       HEADER
    ================================= */

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand {
      font-size: 1rem;
      letter-spacing: .25rem;
      color: #aaa;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(2.5rem, 7vw, 5rem);
      font-weight: 900;
      margin-bottom: 8px;
    }

    h1 .rants {
      color: #e6b400;
    }

    .tagline {
      color: #bbb;
      font-size: 1.1rem;
      font-style: italic;
      text-align: center;
    }

    .tagline-line {
      display: inline;
    }


    /* =================================
       DESKTOP NAVIGATION
    ================================= */

    .desktop-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      gap: 18px 30px;

      margin: 35px 0 45px;

      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }

    .desktop-nav a {
      color: #ffffff;
      text-decoration: none;

      font-size: .9rem;
      font-weight: bold;

      letter-spacing: .12rem;

      transition: color .2s;
    }

    .desktop-nav a:hover {
      color: #e6b400;
    }

    .desktop-nav a.active {
      color: #e6b400;
    }


    /* =================================
       MOBILE HAMBURGER NAVIGATION
    ================================= */

    .mobile-nav {
      display: none;

      margin: 30px 0 40px;

      border-bottom: 1px solid #333;

      padding-bottom: 15px;
    }

    .mobile-nav-bar {
      display: flex;
      justify-content: center;
    }

    .menu-button {
      appearance: none;

      background: transparent;

      border: 0;

      color: #ffffff;

      font-size: 32px;
      line-height: 1;

      cursor: pointer;

      padding: 5px 4px;

      transition: color .2s;
    }

    .menu-button:hover {
      color: #e6b400;
    }

    .mobile-menu {
      display: none;

      width: 100%;

      margin-top: 15px;

      background: #181818;

      border: 1px solid #333;
      border-radius: 8px;

      overflow: hidden;
    }

    .mobile-menu.open {
      display: block;
    }

    .mobile-menu a {
      display: block;

      width: 100%;

      padding: 17px 20px;

      color: #ffffff;

      text-decoration: none;

      font-size: .9rem;
      font-weight: bold;

      letter-spacing: .12rem;

      text-align: center;

      border-bottom: 1px solid #2d2d2d;

      transition:
        color .2s,
        background .2s;
    }

    .mobile-menu a:last-child {
      border-bottom: none;
    }

    .mobile-menu a:hover {
      color: #e6b400;
      background: #202020;
    }

    .mobile-menu a.active {
      color: #e6b400;
    }


    /* =================================
       THE WHOLE THING
    ================================= */

    .whole-thing-section {
      text-align: center;

      width: 100%;
      max-width: 900px;

      margin: 0 auto;
    }

    .whole-thing-heading {
      color: #e6b400;

      font-size: 1.5rem;
      font-weight: 900;
      font-style: italic;

      letter-spacing: .12rem;

      margin-bottom: 10px;
    }

    .whole-thing-subtitle {
      color: #888;

      font-size: .95rem;
      font-style: italic;

      margin-bottom: 25px;
    }

    .whole-thing-card {
      width: 100%;

      cursor: pointer;
    }

    .thumbnail {
      position: relative;

      width: 100%;

      aspect-ratio: 16 / 9;

      background: #222;

      border-radius: 8px;

      overflow: hidden;

      box-shadow: 0 10px 35px rgba(0,0,0,.35);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .thumbnail:hover {
      transform: scale(1.025);

      box-shadow:
        0 8px 25px rgba(0,0,0,.5);
    }

    .thumbnail img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }


    /* =================================
       PLAY BUTTON
    ================================= */

    .play-button {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 72px;
      height: 72px;

      background: rgba(0,0,0,.7);

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
      color: white;

      opacity: 0;

      transition: opacity .2s;
    }

    .thumbnail:hover .play-button {
      opacity: 1;
    }


    /* =================================
       FOOTER
    ================================= */

    footer {
      text-align: center;

      margin-top: 60px;

      color: #666;

      font-size: .85rem;
    }


    /* =================================
       VIDEO MODAL
    ================================= */

    .modal {
      display: none;

      position: fixed;
      z-index: 1000;

      inset: 0;

      width: 100%;
      height: 100%;

      background: rgba(0,0,0,.92);

      align-items: center;
      justify-content: center;

      padding: 40px;
    }

    .modal-content {
      width: 100%;
      max-width: 1100px;

      position: relative;
    }

    .modal-video {
      width: 100%;

      aspect-ratio: 16 / 9;

      background: #000;
    }

    .modal-video iframe {
      display: block;

      width: 100%;
      height: 100%;

      border: none;
    }

    .close-button {
      position: absolute;

      right: 0;
      top: -45px;

      color: white;

      font-size: 35px;

      cursor: pointer;

      z-index: 1100;
    }


    /* =================================
       PHONE
    ================================= */

    @media (max-width: 550px) {

      .desktop-nav {
        display: none;
      }

      .mobile-nav {
        display: block;
      }

      .tagline-line {
        display: block;
        text-align: center;
      }

      .whole-thing-heading {
        font-size: 1.25rem;
      }

      .whole-thing-subtitle {
        font-size: .9rem;
      }

      .play-button {
        width: 60px;
        height: 60px;

        font-size: 25px;

        opacity: 1;
      }

    }


    /* =================================
       MOBILE / TOUCH VIDEO PLAYER
    ================================= */

    @media (hover: none) and (pointer: coarse) {

      .modal {
        padding: 0;

        width: 100vw;

        height: 100vh;
        height: 100dvh;

        background: #000;
      }

      .modal-content {
        width: 100vw;

        height: 100vh;
        height: 100dvh;

        max-width: none;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .modal-video {
        width: 100vw;

        height: 100vh;
        height: 100dvh;

        aspect-ratio: auto;

        background: #000;
      }

      .modal-video iframe {
        width: 100%;
        height: 100%;
      }

      .close-button {
        position: fixed;

        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));

        width: 44px;
        height: 44px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(0,0,0,.65);

        border-radius: 50%;

        font-size: 34px;

        z-index: 1200;
      }

    }

  </style>

</head>


<body>


<div class="site-wrapper">


  <!-- =================================
       HEADER
  ================================= -->

  <header>

    <div class="brand">
      BIRD DOG ANIMATION PRESENTS
    </div>

    <h1>
      WILBA <span class="rants">RANTS</span>
    </h1>

    <p class="tagline">
      <span class="tagline-line">Honest conversations</span>
      <span class="tagline-line">between a man and his dog.</span>
    </p>

  </header>


  <!-- =================================
       DESKTOP NAVIGATION
  ================================= -->

  <nav class="desktop-nav">

    <a href="index.html">
      FRESHLY PUBLISHED
    </a>

    <a href="classics.html">
      CLASSIC RANTS
    </a>

    <a href="about.html">
      ABOUT WILBA
    </a>

  </nav>


  <!-- =================================
       MOBILE NAVIGATION
  ================================= -->

  <div class="mobile-nav">

    <div class="mobile-nav-bar">

      <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="mobileMenu"
        onclick="toggleMenu()"
      >
        ☰
      </button>

    </div>


    <div
      class="mobile-menu"
      id="mobileMenu"
    >

      <a href="index.html">
        FRESHLY PUBLISHED
      </a>

      <a
        href="wholething.html"
        class="active"
      >
        THE WHOLE THING
      </a>

      <a href="classics.html">
        CLASSIC RANTS
      </a>

      <a href="about.html">
        ABOUT WILBA
      </a>

    </div>

  </div>


  <!-- =================================
       THE WHOLE THING
  ================================= -->

  <main>

    <section class="whole-thing-section">

      <div class="whole-thing-heading">
        THE WHOLE THING
      </div>

      <div class="whole-thing-subtitle">
        Every Freshly Published Rant. One After Another.
      </div>


      <div
        class="whole-thing-card"
        onclick="openVideo('https://player.mediadelivery.net/play/726343/9046da8f-c3ed-42de-b6ac-af7857254388')"
      >

        <div class="thumbnail">

          <img
            src="images/WholeThing.png"
            alt="The Whole Thing"
          >

          <div class="play-button">
            ▶
          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- =================================
       FOOTER
  ================================= -->

  <footer>
    © 2026 Bird Dog Cartoons
  </footer>


</div>



<!-- =================================
     VIDEO POPUP
================================= -->

<div
  id="videoModal"
  class="modal"
  onclick="closeVideo(event)"
>

  <div class="modal-content">

    <div
      class="close-button"
      onclick="closeVideo()"
    >
      ×
    </div>

    <div
      id="modalVideo"
      class="modal-video"
    >
    </div>

  </div>

</div>



<script>


  /* =================================
     MOBILE MENU
  ================================= */

  function toggleMenu() {

    const menu =
      document.getElementById("mobileMenu");

    const button =
      document.getElementById("menuButton");


    const isOpen =
      menu.classList.toggle("open");


    button.setAttribute(
      "aria-expanded",
      isOpen
    );


    if (isOpen) {

      button.innerHTML = "×";

      button.setAttribute(
        "aria-label",
        "Close navigation menu"
      );

    }

    else {

      button.innerHTML = "☰";

      button.setAttribute(
        "aria-label",
        "Open navigation menu"
      );

    }

  }


  /* =================================
     OPEN VIDEO
  ================================= */

  function openVideo(videoURL) {

    const modal =
      document.getElementById("videoModal");

    const video =
      document.getElementById("modalVideo");


    video.innerHTML = `

      <iframe
        src="${videoURL}"
        title="The Whole Thing | Wilba Rants"
        allow="
          accelerometer;
          autoplay;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          fullscreen;
        "
        allowfullscreen
      ></iframe>

    `;


    modal.style.display = "flex";

    document.body.style.overflow = "hidden";

  }


  /* =================================
     CLOSE VIDEO
  ================================= */

  function closeVideo(event) {

    const modal =
      document.getElementById("videoModal");


    if (
      event &&
      event.target !== modal
    ) {

      return;

    }


    modal.style.display = "none";


    document
      .getElementById("modalVideo")
      .innerHTML = "";


    document.body.style.overflow = "auto";

  }


  /* =================================
     ESCAPE KEY CLOSES VIDEO
  ================================= */

  document.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Escape") {

        closeVideo();

      }

    }
  );


</script>


</body>

</html>
