<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wilba Rants | Bird Dog Animation</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #111;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    .site-wrapper {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 40px 24px 60px;
    }


    /* =================================
       HEADER
    ================================= */

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand {
      font-size: 1rem;
      letter-spacing: .25rem;
      color: #aaa;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(2.5rem, 7vw, 5rem);
      font-weight: 900;
      margin-bottom: 8px;
    }

    h1 .rants {
      color: #e6b400;
    }

    .tagline {
      color: #bbb;
      font-size: 1.1rem;
      font-style: italic;
    }


    /* =================================
       NAVIGATION
    ================================= */

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px 30px;

      margin: 35px 0 45px;

      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;

      font-size: .9rem;
      font-weight: bold;

      letter-spacing: .12rem;

      transition: color .2s;
    }

    nav a:hover {
      color: #e6b400;
    }

    nav a.active {
      color: #e6b400;
    }


    /* =================================
       VIDEO GRID
    ================================= */

    .video-grid {
      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 28px;
    }

    .video-card {
      cursor: pointer;
    }

    .thumbnail {
      position: relative;

      width: 100%;

      aspect-ratio: 16 / 9;

      background: #222;

      border-radius: 8px;

      overflow: hidden;

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .thumbnail:hover {
      transform: scale(1.025);

      box-shadow:
        0 8px 25px rgba(0,0,0,.5);
    }

    .thumbnail img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }


    /* =================================
       VIDEO PLACEHOLDER
    ================================= */

    .thumbnail-placeholder {
      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 25px;

      background:
        linear-gradient(
          135deg,
          #282828,
          #171717
        );

      color: #e6b400;

      font-size: 1rem;
      font-weight: bold;

      letter-spacing: .12rem;
    }


    /* =================================
       PLAY ICON
    ================================= */

    .play-button {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 60px;
      height: 60px;

      background: rgba(0,0,0,.7);

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;
      color: white;

      opacity: 0;

      transition: opacity .2s;
    }

    .thumbnail:hover .play-button {
      opacity: 1;
    }


    /* =================================
       VIDEO INFORMATION
    ================================= */

    .video-title {
      margin-top: 12px;

      font-size: 1.05rem;
      font-weight: bold;
    }

    .video-description {
      margin-top: 5px;

      color: #888;

      font-size: .9rem;
    }


    /* =================================
       VIDEO MODAL
    ================================= */

    .modal {
      display: none;

      position: fixed;

      z-index: 1000;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: rgba(0,0,0,.92);

      align-items: center;
      justify-content: center;

      padding: 40px;
    }

    .modal-content {
      width: 100%;
      max-width: 1100px;

      position: relative;
    }

    .modal-video {
      width: 100%;

      aspect-ratio: 16 / 9;

      background: #000;
    }

    .modal-video iframe {
      width: 100%;
      height: 100%;

      border: none;
    }

    .close-button {
      position: absolute;

      right: 0;
      top: -45px;

      color: white;

      font-size: 35px;

      cursor: pointer;

      transition: color .2s;
    }

    .close-button:hover {
      color: #e6b400;
    }


    /* =================================
       FOOTER
    ================================= */

    footer {
      text-align: center;

      margin-top: 60px;

      color: #666;

      font-size: .85rem;
    }


    /* =================================
       TABLET
    ================================= */

    @media (max-width: 850px) {

      .video-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }


    /* =================================
       PHONE
    ================================= */

    @media (max-width: 550px) {

      .video-grid {
        grid-template-columns: 1fr;
      }

      nav {
        gap: 15px 20px;
      }

      .modal {
        padding: 20px;
      }

    }

  </style>

</head>


<body>


<div class="site-wrapper">


  <!-- =================================
       HEADER
  ================================= -->

  <header>

    <div class="brand">
      BIRD DOG ANIMATION PRESENTS
    </div>

    <h1>
      WILBA <span class="rants">RANTS</span>
    </h1>

    <p class="tagline">
      Honest conversations between a man and his dog.
    </p>

  </header>


  <!-- =================================
       NAVIGATION
  ================================= -->

  <nav>

    <a
      href="index.html"
      id="fresh-link"
    >
      FRESHLY PUBLISHED
    </a>

    <a
      href="classics.html"
      id="classic-link"
    >
      CLASSIC RANTS
    </a>

    <a
      href="about.html"
      id="about-link"
    >
      ABOUT WILBA
    </a>

  </nav>


  <!-- =================================
       VIDEO GALLERY
  ================================= -->

  <main>

    <div class="video-grid">


      <!-- =================================
           RANT 1
      ================================= -->

      <div
        class="video-card"
        onclick="openVideo('YOUR-BUNNY-VIDEO-URL-HERE')"
      >

        <div class="thumbnail">

          <img
            src="thumbnail1.jpg"
            alt="Dad! Can You Breathe, Son?!"
          >

          <div class="play-button">
            ▶
          </div>

        </div>

        <div class="video-title">
          Rant One
        </div>

        <div class="video-description">
          Wilba Rants
        </div>

      </div>


      <!-- =================================
           RANT 2
      ================================= -->

      <div
        class="video-card"
        onclick="openVideo('YOUR-BUNNY-VIDEO-URL-HERE')"
      >

        <div class="thumbnail">

          <img
            src="thumbnail2.jpg"
            alt="Money, Gold, and Diamonds"
          >

          <div class="play-button">
            ▶
          </div>

        </div>

        <div class="video-title">
          Rant Two
        </div>

        <div class="video-description">
          Wilba Rants
        </div>

      </div>


      <!-- =================================
           RANT 3
           FIVE DAYS
      ================================= -->

      <div
        class="video-card"
        onclick="openVideo('https://player.mediadelivery.net/play/726343/fffe327c-27f2-4637-aa9b-9f6ae8a9f713')"
      >

        <div class="thumbnail">

  <img
    src="images/5_Days_Thumbnail.jpg"
    alt="Five Days"
  >

  <div class="play-button">
    ▶
  </div>

</div>

        <div class="video-title">
          Five Days
        </div>

        <div class="video-description">
          Wilba Rants
        </div>

      </div>


    </div>

  </main>


  <!-- =================================
       FOOTER
  ================================= -->

  <footer>
    © 2026 Bird Dog Cartoons
  </footer>


</div>



<!-- =================================
     VIDEO POPUP
================================= -->

<div
  id="videoModal"
  class="modal"
  onclick="closeVideo(event)"
>

  <div class="modal-content">

    <div
      class="close-button"
      onclick="closeVideo()"
    >
      ×
    </div>

    <div
      id="modalVideo"
      class="modal-video"
    >
    </div>

  </div>

</div>



<script>


  /* =================================
     ACTIVE NAVIGATION TAB
  ================================= */

  const currentPath =
    window.location.pathname.toLowerCase();


  const freshLink =
    document.getElementById("fresh-link");


  const classicLink =
    document.getElementById("classic-link");


  const aboutLink =
    document.getElementById("about-link");


  if (currentPath.includes("about")) {

    aboutLink.classList.add("active");

  }

  else if (currentPath.includes("classics")) {

    classicLink.classList.add("active");

  }

  else {

    freshLink.classList.add("active");

  }



  /* =================================
     OPEN VIDEO
  ================================= */

  function openVideo(videoURL) {


    /* Don't open unfinished cards. */

    if (
      !videoURL ||
      videoURL.startsWith("YOUR-BUNNY")
    ) {

      return;

    }


    const modal =
      document.getElementById("videoModal");


    const video =
      document.getElementById("modalVideo");


    video.innerHTML = `

      <iframe
        src="${videoURL}"
        title="Wilba Rants Video Player"
        allow="
          accelerometer;
          autoplay;
          encrypted-media;
          gyroscope;
          picture-in-picture;
        "
        allowfullscreen>
      </iframe>

    `;


    modal.style.display = "flex";


    document.body.style.overflow = "hidden";

  }



  /* =================================
     CLOSE VIDEO
  ================================= */

  function closeVideo(event) {


    const modal =
      document.getElementById("videoModal");


    if (
      event &&
      event.target !== modal
    ) {

      return;

    }


    modal.style.display = "none";


    document
      .getElementById("modalVideo")
      .innerHTML = "";


    document.body.style.overflow = "auto";

  }



  /* =================================
     ESCAPE KEY CLOSES VIDEO
  ================================= */

  document.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Escape") {

        closeVideo();

      }

    }
  );


</script>


</body>

</html>
